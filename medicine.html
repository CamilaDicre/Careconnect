<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Guide - Careconnect</title>
    <link rel="icon" type="image/png" href="assets/carefavicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="departments.css">
    <link rel="stylesheet" href="css/responsive-transitions.css">
    <link rel="stylesheet" href="css/universal-responsive.css">
    <link rel="stylesheet" href="css/transitions.css">
    <style>
        body {
            background: #f4f8ff;
            color: #1f2937;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }
        .page-header {
            text-align: center;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            padding: 3rem 1rem 2.5rem;
        }
        .page-header h1 {
            margin: 0;
            font-size: clamp(2.5rem, 4vw, 3.75rem);
            line-height: 1.05;
        }
        .page-header p {
            margin-top: 1rem;
            max-width: 760px;
            margin-left: auto;
            margin-right: auto;
            font-size: 1rem;
            opacity: 0.85;
        }
        .page-actions {
            margin-top: 1.75rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.9rem;
        }
        .page-actions a {
            padding: 0.95rem 1.75rem;
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-primary {
            background: #0f172a;
            color: white;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.18);
            color: white;
            border: 1px solid rgba(255,255,255,0.32);
        }
        .page-actions a:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 38px rgba(15, 23, 42, 0.18);
        }
        .main-content {
            max-width: 1160px;
            margin: 0 auto;
            padding: 2rem 1.25rem 3rem;
        }
        .medicine-grid,
        .detail-layout {
            display: grid;
            gap: 1.5rem;
        }
        .medicine-grid {
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        }
        .medicine-card,
        .medicine-detail-card,
        .medicine-specs,
        .medicine-notes {
            background: white;
            border-radius: 24px;
            padding: 1.75rem;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(15, 23, 42, 0.05);
        }
        .medicine-card img,
        .detail-image {
            width: 100%;
            border-radius: 18px;
            object-fit: cover;
            max-height: 260px;
        }
        .medicine-card h3,
        .detail-title {
            margin: 1.25rem 0 0.75rem;
            font-size: 1.5rem;
        }
        .medicine-card p,
        .detail-section p {
            color: #475569;
            line-height: 1.8;
        }
        .medicine-card button,
        .detail-action-btn {
            margin-top: 1.35rem;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            border: none;
            padding: 0.95rem 1.6rem;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .medicine-card button:hover,
        .detail-action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 36px rgba(37, 99, 235, 0.24);
        }
        .detail-layout {
            grid-template-columns: 1.2fr 0.8fr;
            align-items: start;
        }
        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin: 1.25rem 0;
        }
        .tag {
            background: #e0f2fe;
            color: #0c4a6e;
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            font-size: 0.9rem;
        }
        .section-heading {
            margin-bottom: 0.85rem;
            color: #0f172a;
        }
        .detail-specs ul,
        .medicine-notes ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .detail-specs li,
        .medicine-notes li {
            margin-bottom: 0.9rem;
            line-height: 1.75;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 0.95rem;
            border-radius: 999px;
            background: rgba(37, 99, 235, 0.12);
            color: #1e40af;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        @media (max-width: 960px) {
            .detail-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="page-header">
        <div class="container">
            <h1>Medication Guide</h1>
            <p>Explore common medications by condition and get a clear, easy-to-read detail view for each treatment option.</p>
            <div class="page-actions">
                <a class="btn-secondary" href="departments.html">Back to departments</a>
                <a class="btn-primary" href="pages/contact.html">Contact Specialist</a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section id="medicineArea"></section>
    </main>

    <script>
        const medicines = {
            GastroFix: {
                name: 'GastroFix',
                condition: 'Stomach Ache',
                image: 'https://via.placeholder.com/900x500.png?text=GastroFix',
                description: 'GastroFix helps relieve stomach pain, acid reflux, and indigestion. It is designed for short-term relief and supports digestive comfort.',
                dosage: 'Take one tablet after meals, up to three times per day. Do not exceed 3 tablets in 24 hours.',
                activeIngredients: 'Calcium carbonate, simethicone, omeprazole',
                warning: 'Avoid if you have severe abdominal pain, vomiting, or allergy to ingredients. Consult a doctor when pregnant or breastfeeding.',
                tags: ['Stomach', 'Digestive Support', 'OTC']
            },
            Lisinopril: {
                name: 'Lisinopril',
                condition: 'Hypertension',
                image: 'https://via.placeholder.com/900x500.png?text=Lisinopril',
                description: 'Lisinopril is prescribed for high blood pressure and heart failure. It lowers blood pressure by relaxing blood vessels.',
                dosage: 'Take one tablet daily with or without food. Do not stop treatment abruptly without medical advice.',
                activeIngredients: 'Lisinopril',
                warning: 'Monitor blood pressure and kidney function. Avoid potassium supplements unless directed by a physician.',
                tags: ['Blood Pressure', 'Cardiac Care', 'Prescription']
            },
            Ibuprofen: {
                name: 'Ibuprofen',
                condition: 'Headache',
                image: 'https://via.placeholder.com/900x500.png?text=Ibuprofen',
                description: 'Ibuprofen is an NSAID used to treat headaches, muscle pain, inflammation, and fever. It reduces swelling while relieving pain.',
                dosage: 'Take 200-400 mg every 4-6 hours as needed. Do not exceed 1200 mg in 24 hours without medical advice.',
                activeIngredients: 'Ibuprofen',
                warning: 'Take with food to reduce stomach irritation. Avoid use with certain blood pressure medicines and if you have ulcers.',
                tags: ['Pain Relief', 'Anti-inflammatory', 'OTC']
            },
            Acetaminophen: {
                name: 'Acetaminophen',
                condition: 'Colds',
                image: 'https://via.placeholder.com/900x500.png?text=Acetaminophen',
                description: 'Acetaminophen reduces fever and relieves mild pain associated with colds and flu. It is gentler on the stomach than many NSAIDs.',
                dosage: 'Take 500-650 mg every 4-6 hours. Do not exceed 3000 mg in 24 hours.',
                activeIngredients: 'Acetaminophen',
                warning: 'Do not use with other acetaminophen products. Consult a doctor if you have liver disease.',
                tags: ['Fever', 'Pain Relief', 'OTC']
            },
            Omeprazole: {
                name: 'Omeprazole',
                condition: 'Gastritis',
                image: 'https://via.placeholder.com/900x500.png?text=Omeprazole',
                description: 'Omeprazole decreases stomach acid production and helps heal irritation caused by gastritis, acid reflux, and ulcers.',
                dosage: 'Take one capsule daily before breakfast for 14 days or as prescribed by a doctor.',
                activeIngredients: 'Omeprazole',
                warning: 'Long-term use may require monitoring. Avoid if you have low magnesium or osteoporosis without guidance.',
                tags: ['Acid Control', 'Gastric Health', 'Prescription']
            },
            Naproxen: {
                name: 'Naproxen',
                condition: 'Joint Pain',
                image: 'https://via.placeholder.com/900x500.png?text=Naproxen',
                description: 'Naproxen is an NSAID used to relieve joint pain, stiffness, and inflammation in arthritis or injury.',
                dosage: 'Take 250-500 mg every 8-12 hours as needed. Do not exceed 1000 mg in 24 hours.',
                activeIngredients: 'Naproxen sodium',
                warning: 'Use with caution if you have heart, kidney, or gastrointestinal issues. Take with food to decrease stomach upset.',
                tags: ['Joint Health', 'Inflammation', 'OTC']
            }
        };

        function renderMedicineList() {
            const area = document.getElementById('medicineArea');
            area.innerHTML = `
                <div class="medicine-grid">
                    ${Object.values(medicines).map((medicine) => `
                        <div class="medicine-card">
                            <img src="${medicine.image}" alt="${medicine.name}">
                            <h3>${medicine.name}</h3>
                            <div class="badge">${medicine.condition}</div>
                            <p>${medicine.description}</p>
                            <button onclick="window.location.href='medicine.html?medicina=${encodeURIComponent(medicine.name)}'">View Details</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderMedicineDetail(medicine) {
            const area = document.getElementById('medicineArea');
            area.innerHTML = `
                <div class="medicine-detail-card">
                    <div class="badge">Condition: ${medicine.condition}</div>
                    <div class="detail-layout">
                        <div>
                            <img class="detail-image" src="${medicine.image}" alt="${medicine.name}">
                        </div>
                        <div>
                            <h2 class="detail-title">${medicine.name}</h2>
                            <div class="detail-meta">
                                ${medicine.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                            </div>
                            <p class="detail-description">${medicine.description}</p>
                            <div class="detail-section">
                                <h4 class="section-heading">Recommended Dosage</h4>
                                <p>${medicine.dosage}</p>
                            </div>
                            <div class="detail-section">
                                <h4 class="section-heading">Active Ingredients</h4>
                                <p>${medicine.activeIngredients}</p>
                            </div>
                            <div class="detail-section">
                                <h4 class="section-heading">Warnings</h4>
                                <p>${medicine.warning}</p>
                            </div>
                            <div class="page-actions" style="justify-content: flex-start;">
                                <a class="btn-secondary" href="departments.html">Back to departments</a>
                                <a class="btn-primary" href="pages/contact.html">Contact Specialist</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="medicine-grid">
                    <div class="medicine-specs">
                        <h4 class="section-heading">Medication Facts</h4>
                        <ul>
                            <li><strong>Category:</strong> ${medicine.condition}</li>
                            <li><strong>Form:</strong> Tablet / capsule</li>
                            <li><strong>Availability:</strong> OTC or prescription depending on your doctor</li>
                            <li><strong>Purpose:</strong> Symptom relief and improved daily comfort</li>
                        </ul>
                    </div>
                    <div class="medicine-notes">
                        <h4 class="section-heading">Helpful Notes</h4>
                        <ul>
                            <li>Always consult with a healthcare professional before starting or changing any medication.</li>
                            <li>Keep a medication list and share it with doctors and caregivers.</li>
                            <li>If you notice side effects, stop use and seek medical advice immediately.</li>
                            <li>Store medications safely away from children and pets.</li>
                        </ul>
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const selected = params.get('medicina');
            const medicine = selected ? medicines[selected] : null;

            if (medicine) {
                renderMedicineDetail(medicine);
                document.title = `${medicine.name} - Careconnect`;
            } else {
                renderMedicineList();
                document.title = 'Medication Guide - Careconnect';
            }
        });
    </script>
</body>
</html>
